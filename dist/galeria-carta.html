<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Se come con los ojos. · Hoyo 19</title><style>*{box-sizing:border-box}body{margin:0;background:#350b09;color:#fff0d9;font-family:Georgia,serif}header{padding:32px 5vw;border-bottom:1px solid #ffffff30}h1{font-weight:400;font-size:clamp(32px,5vw,60px);margin:12px 0}p{line-height:1.5}nav{position:sticky;top:0;background:#350b09f5;z-index:2;padding:14px 5vw;display:flex;gap:12px;overflow:auto}button{white-space:nowrap;background:transparent;border:1px solid #ffffff60;color:inherit;padding:10px 16px;cursor:pointer}button[aria-pressed=true]{background:#f9ead4;color:#641a14}main{padding:24px 5vw;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px}figure{margin:0}img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#52221d;display:block}figcaption{padding:12px 0;font-size:20px}small{display:block;font:12px sans-serif;opacity:.7;margin-top:6px}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible{outline:3px solid #d3b778;outline-offset:4px}@media(max-width:500px){main{grid-template-columns:1fr 1fr;gap:12px;padding:18px}figcaption{font-size:16px}header{padding:24px 18px}}</style><header><small>HOYO 19 · ABRE EL APETITO</small><h1>Se come con los ojos.</h1><p>Date un paseo por nuestros sabores. Mira de cerca, elige tu antojo y ven con hambre.</p><p id="count"></p></header><nav aria-label="Filtrar por categoría"></nav><main></main><script>
fetch('assets/carta-burdeos/manifest.json').then(r=>r.json()).then(data=>{
const items=data.tasks;const nav=document.querySelector('nav');const main=document.querySelector('main');let category='Todas';
function render(){main.replaceChildren();const selected=items.filter(t=>category==='Todas'||t.category===category);document.querySelector('#count').textContent=category==='Todas' ? 'Para compartir, para saborear, para volver.' : category+' · ¿Por cuál empezamos?' ;
for(const t of selected){const f=document.createElement('figure');const a=document.createElement('a');a.href='assets/carta-burdeos/'+t.id+'.png';a.target='_blank';a.rel='noopener';const img=document.createElement('img');img.src=a.href;img.alt=t.name;img.loading='lazy';img.onerror=()=>{f.hidden=true};a.append(img);const c=document.createElement('figcaption');c.textContent=t.name;const s=document.createElement('small');s.textContent=t.category+(t.provisional?' · Composición por confirmar':'');c.append(s);f.append(a,c);main.append(f)}}
for(const name of ['Todas',...new Set(items.map(t=>t.category))]){const b=document.createElement('button');b.textContent=name;b.setAttribute('aria-pressed',String(name===category));b.onclick=()=>{category=name;for(const x of nav.children)x.setAttribute('aria-pressed',String(x===b));render()};nav.append(b)}render();
});</script></html>
